server:
  port: 8087

spring:
  threads:
    virtual:
      enabled: true
  application:
    name: analytics-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000
      database: 0
  cloud:
    kubernetes:
      discovery:
        enabled: false
      loadbalancer:
        mode: service

services:
  vendor:
    url: ${VENDOR_SERVICE_URL:http://localhost:8082}
  procurement:
    url: ${PROCUREMENT_SERVICE_URL:http://localhost:8084}
  rfq:
    url: ${RFQ_SERVICE_URL:http://localhost:8083}

jwt:
  secret: ${JWT_SECRET:procurement-default-secret-key-change-in-production-min32chars}

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
    instances:
      vendorService:
        baseConfig: default
      procurementService:
        baseConfig: default
      rfqService:
        baseConfig: default


