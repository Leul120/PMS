server:
  port: 8086
spring:
  threads:
    virtual:
      enabled: true
  application:
    name: scoring-service
  transaction:
    default-timeout: 30
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5437/scoringdb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:secret}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 1
    consumer:
      group-id: scoring-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.procurement.*,java.util.*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: java.util.HashMap
    listener:
      missing-topics-fatal: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000
      database: 0
  cloud:
    kubernetes:
      discovery:
        enabled: false
      loadbalancer:
        mode: service

# Service URLs
services:
  auth:
    url: ${AUTH_SERVICE_URL:http://localhost:8081}

scoring:
  weights:
    timeliness: 0.35
    quality: 0.35
    cost: 0.20
    responsiveness: 0.10

jwt:
  secret: ${JWT_SECRET:procurement-default-secret-key-change-in-production-min32chars}

# Resilience4j Circuit Breaker
resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
    instances:
      authService:
        baseConfig: default



