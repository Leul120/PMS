<!DOCTYPE html>
<html>
<head>
    <title>Authorization Mismatch Analysis</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .mismatch { background-color: #ffebee; border-left: 4px solid #f44336; padding: 10px; margin: 10px 0; }
        .match { background-color: #e8f5e8; border-left: 4px solid #4caf50; padding: 10px; margin: 10px 0; }
        table { border-collapse: collapse; width: 100%; margin: 20px 0; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .sidebar-role { background-color: #e3f2fd; }
        .backend-role { background-color: #fff3e0; }
        .issue { background-color: #ffcdd2; }
        .summary { background-color: #f5f5f5; padding: 15px; border-radius: 5px; margin: 20px 0; }
    </style>
</head>
<body>
    <h1>Authorization Mismatch Analysis</h1>
    
    <div class="summary">
        <h2>Summary of Findings</h2>
        <div id="summary-content"></div>
    </div>

    <h2>Sidebar vs Backend Permissions Comparison</h2>
    <table id="comparison-table">
        <thead>
            <tr>
                <th>Page</th>
                <th>Route</th>
                <th>Sidebar Allowed</th>
                <th>Backend Allowed</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="comparison-body">
        </tbody>
    </table>

    <h2>Detailed Issues</h2>
    <div id="issues-list"></div>

    <script>
        // Sidebar configuration (what UI shows)
        const sidebarPermissions = {
            "/": ["ADMIN", "OFFICER", "MANAGER", "AUDITOR"],
            "/dashboard/vendor": ["VENDOR"],
            "/vendors": ["ADMIN", "OFFICER", "MANAGER", "AUDITOR"],
            "/requisitions": ["ADMIN", "OFFICER", "MANAGER"],
            "/procurement": ["ADMIN", "OFFICER", "MANAGER", "AUDITOR"],
            "/rfq": ["ADMIN", "OFFICER", "MANAGER", "AUDITOR", "VENDOR"],
            "/orders": ["ADMIN", "OFFICER", "MANAGER", "AUDITOR", "VENDOR"],
            "/deliveries": ["ADMIN", "OFFICER", "MANAGER", "AUDITOR", "VENDOR"],
            "/inventory": ["ADMIN", "OFFICER", "MANAGER", "AUDITOR"],
            "/analytics": ["ADMIN", "OFFICER", "MANAGER", "AUDITOR"],
            "/dashboard/admin": ["ADMIN"],
            "/users": ["ADMIN", "OFFICER", "MANAGER", "AUDITOR"],
            "/notifications": ["ADMIN", "OFFICER", "MANAGER", "AUDITOR", "VENDOR"],
            "/invoices": ["ADMIN", "OFFICER", "MANAGER", "AUDITOR", "VENDOR"],
            "/vendors/performance": ["ADMIN", "OFFICER", "MANAGER", "AUDITOR", "VENDOR"],
            "/settings": ["ADMIN", "OFFICER", "MANAGER", "AUDITOR", "VENDOR"]
        };

        // Backend permissions (what actually works)
        const backendPermissions = {
            // Vendors
            "/api/vendors": ["ADMIN", "OFFICER", "MANAGER", "AUDITOR"], // GET all
            "/api/vendors/{id}": ["ADMIN", "OFFICER", "MANAGER", "AUDITOR", "VENDOR"], // GET by ID
            
            // RFQ
            "/api/rfqs": ["ADMIN", "OFFICER", "MANAGER", "AUDITOR", "VENDOR"], // GET all
            "/api/rfqs/{id}": ["ADMIN", "OFFICER", "MANAGER", "AUDITOR", "VENDOR"], // GET by ID
            
            // Purchase Orders
            "/api/purchase-orders": ["ADMIN", "OFFICER", "MANAGER", "AUDITOR", "VENDOR"], // GET all
            "/api/purchase-orders/{id}": ["ADMIN", "OFFICER", "MANAGER", "AUDITOR", "VENDOR"], // GET by ID
            
            // Inventory
            "/api/inventory": ["ADMIN", "OFFICER", "MANAGER", "AUDITOR"], // GET all
            "/api/inventory/{id}": ["ADMIN", "OFFICER", "MANAGER", "AUDITOR"], // GET by ID
            
            // Analytics
            "/api/dashboard/overview": ["ADMIN", "OFFICER", "MANAGER", "AUDITOR"],
            "/api/reports/spend": ["ADMIN", "OFFICER", "MANAGER", "AUDITOR"],
            "/api/reports/compliance": ["ADMIN", "OFFICER", "MANAGER", "AUDITOR"],
            
            // Auth endpoints
            "/api/auth/users": ["ADMIN"], // User management
            "/api/auth/me": ["ADMIN", "OFFICER", "MANAGER", "AUDITOR", "VENDOR"], // Current user
            
            // Notifications
            "/api/notifications/user/{userId}": ["ADMIN", "OFFICER", "MANAGER", "AUDITOR", "VENDOR"],
            "/api/notifications/user/{userId}/unread": ["ADMIN", "OFFICER", "MANAGER", "AUDITOR", "VENDOR"],
            
            // Settings
            "/api/auth/settings": ["ADMIN", "OFFICER", "MANAGER", "AUDITOR", "VENDOR"],
            
            // Requisitions (from procurement service)
            "/api/procurement/requisitions": ["ADMIN", "OFFICER", "MANAGER"], // Based on typical patterns
            
            // Deliveries & Invoices (from delivery-invoice service)
            "/api/deliveries": ["ADMIN", "OFFICER", "MANAGER", "AUDITOR", "VENDOR"],
            "/api/invoices": ["ADMIN", "OFFICER", "MANAGER", "AUDITOR"], // Note: VENDOR might be excluded here
            
            // Scoring
            "/api/scores/ranking": ["ADMIN", "OFFICER", "MANAGER", "AUDITOR", "VENDOR"],
            "/api/scores/vendor/{id}": ["ADMIN", "OFFICER", "MANAGER", "AUDITOR", "VENDOR"]
        };

        const pageNames = {
            "/": "Dashboard",
            "/dashboard/vendor": "Vendor Dashboard",
            "/vendors": "Vendors",
            "/requisitions": "Requisitions",
            "/procurement": "Procurement",
            "/rfq": "RFQ & Bidding",
            "/orders": "Purchase Orders",
            "/deliveries": "Deliveries",
            "/inventory": "Inventory",
            "/analytics": "Analytics",
            "/dashboard/admin": "Admin Panel",
            "/users": "Team/Users",
            "/notifications": "Notifications",
            "/invoices": "Invoices",
            "/vendors/performance": "Performance",
            "/settings": "Settings"
        };

        function getBackendEndpoint(route) {
            // Map frontend routes to backend endpoints
            const endpointMap = {
                "/": "/api/dashboard/overview",
                "/dashboard/vendor": "/api/auth/me",
                "/vendors": "/api/vendors",
                "/requisitions": "/api/procurement/requisitions",
                "/procurement": "/api/purchase-orders",
                "/rfq": "/api/rfqs",
                "/orders": "/api/purchase-orders",
                "/deliveries": "/api/deliveries",
                "/inventory": "/api/inventory",
                "/analytics": "/api/reports/spend",
                "/dashboard/admin": "/api/auth/users",
                "/users": "/api/auth/users",
                "/notifications": "/api/notifications/user/{userId}",
                "/invoices": "/api/invoices",
                "/vendors/performance": "/api/scores/ranking",
                "/settings": "/api/auth/settings"
            };
            return endpointMap[route] || route;
        }

        function comparePermissions() {
            const tbody = document.getElementById('comparison-body');
            const issuesList = document.getElementById('issues-list');
            const summaryContent = document.getElementById('summary-content');
            
            let issues = [];
            let matches = 0;
            let total = 0;

            Object.keys(sidebarPermissions).forEach(route => {
                const sidebarRoles = sidebarPermissions[route];
                const backendEndpoint = getBackendEndpoint(route);
                const backendRoles = backendPermissions[backendEndpoint] || [];
                
                total++;
                
                // Check if permissions match
                const sidebarSet = new Set(sidebarRoles);
                const backendSet = new Set(backendRoles);
                const isMatch = sidebarSet.size === backendSet.size && 
                               [...sidebarSet].every(role => backendSet.has(role));
                
                if (isMatch) {
                    matches++;
                } else {
                    issues.push({
                        route,
                        pageName: pageNames[route],
                        sidebarRoles,
                        backendRoles,
                        backendEndpoint
                    });
                }
                
                // Add row to table
                const row = document.createElement('tr');
                row.className = isMatch ? 'match' : 'mismatch';
                
                row.innerHTML = `
                    <td><strong>${pageNames[route]}</strong></td>
                    <td>${route}</td>
                    <td class="sidebar-role">${sidebarRoles.join(', ')}</td>
                    <td class="backend-role">${backendRoles.join(', ') || 'Unknown'}</td>
                    <td>${isMatch ? '✅ Match' : '❌ Mismatch'}</td>
                `;
                
                tbody.appendChild(row);
            });

            // Display issues
            issuesList.innerHTML = '';
            issues.forEach(issue => {
                const div = document.createElement('div');
                div.className = 'mismatch';
                
                const missingInBackend = issue.sidebarRoles.filter(r => !issue.backendRoles.includes(r));
                const missingInSidebar = issue.backendRoles.filter(r => !issue.sidebarRoles.includes(r));
                
                div.innerHTML = `
                    <h3>❌ ${issue.pageName} (${issue.route})</h3>
                    <p><strong>Backend Endpoint:</strong> ${issue.backendEndpoint}</p>
                    <p><strong>Sidebar allows:</strong> ${issue.sidebarRoles.join(', ')}</p>
                    <p><strong>Backend allows:</strong> ${issue.backendRoles.join(', ')}</p>
                    ${missingInBackend.length > 0 ? `<p><strong>Roles in sidebar but not backend:</strong> ${missingInBackend.join(', ')}</p>` : ''}
                    ${missingInSidebar.length > 0 ? `<p><strong>Roles in backend but not sidebar:</strong> ${missingInSidebar.join(', ')}</p>` : ''}
                `;
                
                issuesList.appendChild(div);
            });

            // Summary
            summaryContent.innerHTML = `
                <p><strong>Total pages checked:</strong> ${total}</p>
                <p><strong>Matching permissions:</strong> ${matches}</p>
                <p><strong>Mismatches found:</strong> ${issues.length}</p>
                ${issues.length > 0 ? '<p style="color: red;"><strong>⚠️ Authorization mismatches detected! Users may see pages they cannot access.</strong></p>' : '<p style="color: green;"><strong>✅ All permissions match correctly!</strong></p>'}
            `;
        }

        // Run comparison
        comparePermissions();
    </script>
</body>
</html>
