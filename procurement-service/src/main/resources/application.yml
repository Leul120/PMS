server:
  port: 8084

spring:
  threads:
    virtual:
      enabled: true
  application:
    name: procurement-service
  transaction:
    default-timeout: 30
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5435/procurementdb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 1
    listener:
      missing-topics-fatal: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000
      database: 0
  cloud:
    kubernetes:
      discovery:
        enabled: false
      loadbalancer:
        mode: service

services:
  auth:
    url: ${AUTH_SERVICE_URL:http://localhost:8081}
  rfq:
    url: ${RFQ_SERVICE_URL:http://localhost:8083}
  vendor:
    url: ${VENDOR_SERVICE_URL:http://localhost:8082}

approval:
  threshold:
    manager: 10000
    director: 50000

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
    instances:
      authService:
        baseConfig: default
      rfqService:
        baseConfig: default
      vendorService:
        baseConfig: default

jwt:
  secret: ${JWT_SECRET:procurement-default-secret-key-change-in-production-min32chars}
logging:
  level:
    com.procurement: INFO


