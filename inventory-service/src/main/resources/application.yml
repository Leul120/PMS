server:
  port: 8088

spring:
  threads:
    virtual:
      enabled: true
  application:
    name: inventory-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5438/inventorydb}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:secret}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: inventory-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.procurement.*,java.util.*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: java.util.HashMap
    listener:
      missing-topics-fatal: false
  cloud:
    kubernetes:
      discovery:
        enabled: false
      loadbalancer:
        mode: service

services:
  auth:
    url: ${AUTH_SERVICE_URL:http://localhost:8081}

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
    instances:
      authService:
        baseConfig: default

jwt:
  secret: ${JWT_SECRET:procurement-default-secret-key-change-in-production-min32chars}
logging:
  level:
    com.procurement: DEBUG


