apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: procurement
data:
  # Service URLs for inter-service communication
  AUTH_SERVICE_URL: "http://auth-service:8081"
  VENDOR_SERVICE_URL: "http://vendor-service:8082"
  RFQ_SERVICE_URL: "http://rfq-bidding-service:8083"
  PROCUREMENT_SERVICE_URL: "http://procurement-service:8084"
  DELIVERY_SERVICE_URL: "http://delivery-invoice-service:8085"
  SCORING_SERVICE_URL: "http://scoring-service:8086"
  ANALYTICS_SERVICE_URL: "http://analytics-service:8087"
  NOTIFICATION_SERVICE_URL: "http://notification-service:8088"
  
  # Kafka configuration
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  KAFKA_TOPIC_PARTITIONS: "3"
  KAFKA_REPLICATION_FACTOR: "1"
  
  # JWT Configuration
  JWT_EXPIRATION: "28800000"  # 8 hours
  JWT_ALGORITHM: "RS256"

  # Redis configuration
  SPRING_DATA_REDIS_HOST: "redis"
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_DATA_REDIS_TIMEOUT: "2000"
  SPRING_DATA_REDIS_DATABASE: "0"

  # Redisson configuration
  REDISSON_CONNECTION_MINIMUM_IDLE_SIZE: "5"
  REDISSON_CONNECTION_POOL_SIZE: "10"

  # Application settings
  SPRING_PROFILES_ACTIVE: "k8s"
  LOG_LEVEL: "INFO"
