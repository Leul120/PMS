apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: procurement

resources:
  # Namespace
  - namespace.yaml
  # Config & Secrets
  - secrets.yaml
  - configmap.yaml
  # Infrastructure — Redis (one per service)
  - redis.yaml
  - redis-services.yaml
  # Infrastructure — PostgreSQL (one per service)
  - postgres-auth.yaml
  - postgres-vendor.yaml
  - postgres-rfq.yaml
  - postgres-procurement.yaml
  - postgres-delivery.yaml
  - postgres-scoring.yaml
  - postgres-inventory.yaml
  - postgres-notification.yaml
  # Infrastructure — Kafka
  - kafka.yaml
  # Application Services
  - auth-service.yaml
  - vendor-service.yaml
  - rfq-bidding-service.yaml
  - procurement-service.yaml
  - delivery-invoice-service.yaml
  - scoring-service.yaml
  - analytics-service.yaml
  - inventory-service.yaml
  - notification-service.yaml
  - api-gateway.yaml
  - frontend.yaml
  # Observability & Tooling
  - kafka-ui.yaml
  # Networking
  - metallb.yaml
  - ingress.yaml

commonLabels:
  environment: production
  project: procurement

images:
  - name: procurement/auth-service
    newTag: latest
  - name: procurement/vendor-service
    newTag: latest
  - name: procurement/rfq-bidding-service
    newTag: latest
  - name: procurement/procurement-service
    newTag: latest
  - name: procurement/delivery-invoice-service
    newTag: latest
  - name: procurement/scoring-service
    newTag: latest
  - name: procurement/analytics-service
    newTag: latest
  - name: procurement/inventory-service
    newTag: latest
  - name: procurement/notification-service
    newTag: latest
  - name: procurement/api-gateway
    newTag: latest
  - name: procurement/frontend
    newTag: latest
