# Redis Instances - One Per Service for Complete Isolation
# This provides complete data isolation between microservices

# ============================================
# Redis for Auth Service
# ============================================
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-auth-config
  namespace: procurement
data:
  redis.conf: |
    maxmemory 64mb
    maxmemory-policy allkeys-lru
    save 900 1
    save 300 10
    timeout 300
    tcp-keepalive 300
    protected-mode yes

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-auth-data
  namespace: procurement
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-auth
  namespace: procurement
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-auth
  template:
    metadata:
      labels:
        app: redis-auth
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          command: ["redis-server", "/etc/redis/redis.conf"]
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/redis
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: redis-auth-data
        - name: config
          configMap:
            name: redis-auth-config

---
apiVersion: v1
kind: Service
metadata:
  name: redis-auth
  namespace: procurement
spec:
  selector:
    app: redis-auth
  ports:
    - port: 6379
      targetPort: 6379

