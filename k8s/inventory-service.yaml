apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: procurement
  labels:
    app: inventory-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      containers:
        - name: inventory-service
          image: procurement/inventory-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8088
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres-inventory:5432/inventorydb"
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: inventory-db-password
            - name: JWT_PUBLIC_KEY_PATH
              value: "file:/etc/jwt-keys/jwt-public.key"
          volumeMounts:
            - name: jwt-keys
              mountPath: /etc/jwt-keys
              readOnly: true
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8088
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8088
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: jwt-keys
          secret:
            secretName: jwt-keys

---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: procurement
spec:
  selector:
    app: inventory-service
  ports:
    - port: 8088
      targetPort: 8088
  type: ClusterIP
