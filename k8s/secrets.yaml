apiVersion: v1
kind: Secret
metadata:
  name: jwt-keys
  namespace: procurement
type: Opaque
stringData:
  # RSA Private Key - Keep Secret!
  # Used only by auth-service to sign JWT tokens
  # Generate with: openssl genrsa 2048 | base64 -w0
  jwt-private.pem: |
    -----BEGIN RSA PRIVATE KEY-----
    # Replace with your generated private key
    # This is a placeholder - generate real keys for production
    -----END RSA PRIVATE KEY-----
  
  # RSA Public Key - Can be shared with other services
  # Used by all services to verify JWT tokens
  jwt-public.pem: |
    -----BEGIN PUBLIC KEY-----
    # Replace with your generated public key
    # This is a placeholder - generate real keys for production
    -----END PUBLIC KEY-----

---
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: procurement
type: Opaque
stringData:
  # PostgreSQL credentials for all databases
  auth-db-password: secret
  vendor-db-password: secret
  rfq-db-password: secret
  procurement-db-password: secret
  delivery-db-password: secret
  scoring-db-password: secret
  inventory-db-password: secret
  notification-db-password: secret

---
apiVersion: v1
kind: Secret
metadata:
  name: kafka-credentials
  namespace: procurement
type: Opaque
stringData:
  # Kafka configuration (if SASL enabled)
  kafka-username: procurement
  kafka-password: secret
