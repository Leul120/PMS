# MetalLB Configuration for LoadBalancer services in kind clusters
# Apply this if using kind and want LoadBalancer type services
---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: procurement-pool
  namespace: metallb-system
spec:
  addresses:
    - 172.18.255.200-172.18.255.250
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: procurement-advert
  namespace: metallb-system
