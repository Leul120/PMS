apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: procurement
  labels:
    app: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: procurement/api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: JWT_PUBLIC_KEY_PATH
              value: "file:/etc/jwt-keys/jwt-public.key"
            - name: SPRING_PROFILES_ACTIVE
              value: "k8s"
            - name: KUBERNETES_NAMESPACE
              value: "procurement"
            - name: SPRING_DATA_REDIS_HOST
              value: "redis"
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
          volumeMounts:
            - name: jwt-keys
              mountPath: /etc/jwt-keys
              readOnly: true
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: jwt-keys
          secret:
            secretName: jwt-keys

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: procurement
spec:
  selector:
    app: api-gateway
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP

---
# LoadBalancer service for external access (cloud) or NodePort for local
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-lb
  namespace: procurement
  annotations:
    # For MetalLB (local kind clusters)
    metallb.universe.tf/loadBalancerIPs: 172.18.255.200
spec:
  selector:
    app: api-gateway
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080
  type: NodePort
