# Docker-specific API Gateway configuration
server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://auth-service:8081
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=0
            - PreserveHostHeader
        - id: vendor-service
          uri: http://vendor-service:8082
          predicates:
            - Path=/api/vendors/**
          filters:
            - StripPrefix=0
        - id: rfq-bidding-service
          uri: http://rfq-bidding-service:8083
          predicates:
            - Path=/api/rfqs/**,/api/bids/**
          filters:
            - StripPrefix=0
        - id: procurement-service
          uri: http://procurement-service:8084
          predicates:
            - Path=/api/purchase-orders/**,/api/procurement/**
          filters:
            - StripPrefix=0
        - id: delivery-invoice-service
          uri: http://delivery-invoice-service:8085
          predicates:
            - Path=/api/deliveries/**,/api/invoices/**
          filters:
            - StripPrefix=0
        - id: scoring-service
          uri: http://scoring-service:8086
          predicates:
            - Path=/api/scores/**
          filters:
            - StripPrefix=0
        - id: analytics-service
          uri: http://analytics-service:8087
          predicates:
            - Path=/api/reports/**,/api/dashboard/**,/api/analytics/**
          filters:
            - StripPrefix=0
        - id: inventory-service
          uri: http://inventory-service:8088
          predicates:
            - Path=/api/inventory/**
          filters:
            - StripPrefix=0
        - id: notification-service
          uri: http://notification-service:8089
          predicates:
            - Path=/api/notifications/**
          filters:
            - StripPrefix=0
        - id: delivery-invoice-service-extra
          uri: http://delivery-invoice-service:8085
          predicates:
            - Path=/api/threewaymatch/**,/api/disputes/**
          filters:
            - StripPrefix=0
        - id: auth-admin-service
          uri: http://auth-service:8081
          predicates:
            - Path=/api/admin/**
          filters:
            - StripPrefix=0
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "http://localhost:*"
              - "http://127.0.0.1:*"
              - "http://frontend:*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders:
              - "*"
            allowCredentials: true
            exposedHeaders:
              - Authorization
              - Content-Type
              - X-User-Id
              - X-User-Role
            maxAge: 3600

logging:
  level:
    org.springframework.cloud.gateway: INFO
