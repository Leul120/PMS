server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3000ms
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=0
        - id: vendor-service
          uri: ${VENDOR_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/vendors/**
          filters:
            - StripPrefix=0
        - id: rfq-bidding-service
          uri: ${RFQ_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/rfqs/**,/api/bids/**
          filters:
            - StripPrefix=0
        - id: procurement-service
          uri: ${PROCUREMENT_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/purchase-orders/**,/api/procurement/**
          filters:
            - StripPrefix=0
        - id: delivery-invoice-service
          uri: ${DELIVERY_INVOICE_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/deliveries/**,/api/invoices/**
          filters:
            - StripPrefix=0
        - id: scoring-service
          uri: ${SCORING_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/scores/**
          filters:
            - StripPrefix=0
        - id: analytics-service
          uri: ${ANALYTICS_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/api/reports/**,/api/dashboard/**,/api/analytics/**
          filters:
            - StripPrefix=0
        - id: inventory-service
          uri: ${INVENTORY_SERVICE_URL:http://localhost:8088}
          predicates:
            - Path=/api/inventory/**
          filters:
            - StripPrefix=0
        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8089}
          predicates:
            - Path=/api/notifications/**
          filters:
            - StripPrefix=0
        - id: delivery-invoice-service-extra
          uri: ${DELIVERY_INVOICE_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/threewaymatch/**,/api/disputes/**
          filters:
            - StripPrefix=0
        - id: auth-admin-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/admin/**
          filters:
            - StripPrefix=0
        - id: auth-super-admin-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/super-admin/**
          filters:
            - StripPrefix=0
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "http://localhost:3000"
              - "http://localhost:*"
              - "http://127.0.0.1:3000"
              - "http://frontend:3000"
              - "${FRONTEND_URL:http://localhost:3000}"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - Authorization
              - Content-Type
              - X-User-Id
            allowCredentials: true
            exposedHeaders:
              - Authorization
              - Content-Type
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE

jwt:
  secret: ${JWT_SECRET:procurement-default-secret-key-change-in-production-min32chars}

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
