server:
  port: 8085
spring:
  threads:
    virtual:
      enabled: true
  application:
    name: delivery-invoice-service
  transaction:
    default-timeout: 30
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5436/deliverydb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:secret}
    hikari:
      maximum-pool-size: 15
      minimum-idle: 3
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 1
    consumer:
      group-id: delivery-service-group
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "com.procurement.*,java.util.*"
    listener:
      missing-topics-fatal: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000
      database: 0
  cloud:
    kubernetes:
      discovery:
        enabled: false
      loadbalancer:
        mode: service

# Service URLs
services:
  auth:
    url: ${AUTH_SERVICE_URL:http://localhost:8081}
  procurement:
    url: ${PROCUREMENT_SERVICE_URL:http://localhost:8084}
  vendor:
    url: ${VENDOR_SERVICE_URL:http://localhost:8082}

jwt:
  secret: ${JWT_SECRET:procurement-default-secret-key-change-in-production-min32chars}

# Resilience4j Circuit Breaker
resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
    instances:
      authService:
        baseConfig: default
      procurementService:
        baseConfig: default
      vendorService:
        baseConfig: default



