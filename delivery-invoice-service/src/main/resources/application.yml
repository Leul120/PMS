server:
  port: 8085
spring:
  application:
    name: delivery-invoice-service
  datasource:
    url: jdbc:postgresql://localhost:5436/deliverydb
    username: postgres
    password: secret
  jpa:
    hibernate:
      ddl-auto: create-drop
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: delivery-service-group
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000
      database: 0
  cloud:
    kubernetes:
      discovery:
        enabled: true
        all-namespaces: false
      loadbalancer:
        mode: service

# Service URLs
services:
  auth:
    url: ${AUTH_SERVICE_URL:http://auth-service:8081}
  procurement:
    url: ${PROCUREMENT_SERVICE_URL:http://procurement-service:8084}

# Resilience4j Circuit Breaker
resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
    instances:
      authService:
        baseConfig: default
      procurementService:
        baseConfig: default
